<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <title>Smart Dustbin Dashboard</title>

<style>
/* ---------------- DARK THEMED ULTRA UI ---------------- */
body{
  font-family:"Poppins",sans-serif;
  background:#020202; 
  margin:0;
  padding:40px 0;
  color:#fff;
}

/* Center all content */
.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

/* Title */
h1{
  text-align:center;
  font-size:34px;
  font-weight:600;
  color:#00eaff;
  letter-spacing:2px;
  text-shadow:0 0 12px #00eaff;
  margin-bottom:10px;
}

/* Top stats cards */
.stats-row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin:10px 0 15px;
}
.stat-card{
  flex:1;
  min-width:150px;
  background:rgba(255,255,255,0.04);
  border-radius:10px;
  padding:10px 14px;
  border:1px solid rgba(0,255,255,0.4);
  box-shadow:0 0 10px rgba(0,255,255,0.25);
}
.stat-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#8af7ff;
}
.stat-value{
  font-size:22px;
  font-weight:600;
  margin-top:4px;
}

/* Table Glass UI */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:10px;
  overflow:hidden;
  color:#fff;
  box-shadow:0 0 15px rgba(0,255,255,.25);
}

th{
  background:#0e0e0e;
  color:#00eaff;
  font-size:15px;
  padding:12px 8px;
  border-bottom:2px solid #00eaff;
}
td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}

.status-ok{background:rgba(0,255,102,0.22);}
.status-mid{background:rgba(255,196,0,0.25);}
.status-full{background:rgba(255,0,60,0.3);color:#fff;font-weight:bold;}

/* Level bar inside cell */
.level-cell{
  display:flex;
  align-items:center;
  gap:8px;
}
.level-bar-bg{
  flex:1;
  height:8px;
  border-radius:4px;
  background:rgba(255,255,255,0.18);
  overflow:hidden;
}
.level-bar-fill{
  height:100%;
  background:linear-gradient(90deg,#00ff9d,#00eaff);
  transition:width .3s ease;
}
.level-text{
  font-size:12px;
  width:40px;
  text-align:right;
}

.updated{
  text-align:right;
  font-size:14px;color:#00ffe5;margin-bottom:5px;
}

/* Chart panel */
#chartPanel{
  margin-top:25px;
  background:rgba(255,255,255,0.05);
  padding:16px 18px 24px;
  border-radius:10px;
  border:1px solid rgba(0,255,255,0.4);
  box-shadow:0 0 15px rgba(0,255,255,.25);
}
#chartPanel h2{
  margin:0 0 10px;
  font-size:20px;
  color:#00eaff;
  text-shadow:0 0 6px #00eaff;
}

/* Toast Notification */
#toast{
  position:fixed;
  right:25px; bottom:25px;
  background:#111; padding:14px 20px;
  border-left:5px solid #00eaff;
  color:#00eaff; border-radius:6px;
  opacity:0; transform:translateY(20px);
  transition:.4s; font-size:14px;
  box-shadow:0 0 10px rgba(0,238,255,.7);
}
#toast.show{opacity:1;transform:translateY(0);}

/* Test Panel */
#testPanel{
  margin-top:30px;
  background:rgba(255,255,255,0.05);
  padding:20px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.20);
  box-shadow:0 0 15px rgba(0,255,255,.25);
}
#testPanel h2{
  margin-top:0;color:#00eaff;
  font-size:20px;letter-spacing:.5px;
  text-shadow:0 0 6px #00eaff;
}
.bin-buttons span{font-size:14px;font-weight:600;width:80px;display:inline-block;}
.bin-buttons button{
  background:#00eaff;border:none;
  padding:7px 14px;font-size:12px;
  border-radius:5px;color:#000;font-weight:bold;
  cursor:pointer;transition:.25s;margin:3px;
}
.bin-buttons button:hover{transform:scale(1.1);box-shadow:0 0 10px #00eaff;}
</style>
</head>

<body onclick="speechSynthesis.resume()">

<div class="container">
  <h1>SMART WASTE MANAGEMENT SYSTEM</h1>

  <!-- STAT CARDS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Bins</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Full</div>
      <div class="stat-value" id="stat-full">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Near Full</div>
      <div class="stat-value" id="stat-near">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">OK</div>
      <div class="stat-value" id="stat-ok">0</div>
    </div>
  </div>

  <div class="updated" id="lastUpdated">Last updated: --</div>

  <table>
    <thead>
      <tr>
        <th>Bin</th><th>Weight (kg)</th><th>Level</th>
        <th>Full By</th><th>Status</th><th>Last Update</th>
      </tr>
    </thead>
    <tbody id="binsBody"></tbody>
  </table>

  <!-- CHART PANEL -->
  <div id="chartPanel">
    <h2>Bin Level History</h2>
    <canvas id="levelChart" height="120"></canvas>
  </div>

  <!-- TEST PANEL -->
  <div id="testPanel">
    <h2>TEST PANEL — BIN SIMULATION</h2>
    <div class="bin-buttons"><span>Bin A</span><button onclick="markFullWeight('A')">Full by Weight</button><button onclick="markFullLevel('A')">Full by Level</button><button onclick="markClean('A')">Cleaned</button></div>
    <div class="bin-buttons"><span>Bin B</span><button onclick="markFullWeight('B')">Full by Weight</button><button onclick="markFullLevel('B')">Full by Level</button><button onclick="markClean('B')">Cleaned</button></div>
    <div class="bin-buttons"><span>Bin C</span><button onclick="markFullWeight('C')">Full by Weight</button><button onclick="markFullLevel('C')">Full by Level</button><button onclick="markClean('C')">Cleaned</button></div>
    <div class="bin-buttons"><span>Bin D</span><button onclick="markFullWeight('D')">Full by Weight</button><button onclick="markFullLevel('D')">Full by Level</button><button onclick="markClean('D')">Cleaned</button></div>
  </div>
</div><!-- /container -->

<div id="toast"></div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const previousState={};

// MOBILE AUDIO UNLOCK
let mobileAudioUnlocked = false;

document.addEventListener("click", () => {
  if (!mobileAudioUnlocked) {
    mobileAudioUnlocked = true;

    const unlock = new SpeechSynthesisUtterance("");
    speechSynthesis.speak(unlock);

    console.log("Mobile audio unlocked");
  }
});

// MOBILE NOTIFICATION UNLOCK
document.addEventListener("click", () => {

  if(Notification.permission !== "granted"){
    Notification.requestPermission().then(permission=>{
      console.log("Notification permission:", permission);
    });
  }

});
// ===== VOICE ADDITION (DO NOT REMOVE ANYTHING ELSE) =====
let voicesLoaded = false;

function loadVoices(){
  return new Promise(resolve=>{
    let voices = speechSynthesis.getVoices();
    if(voices.length){
      voicesLoaded = true;
      resolve(voices);
    }else{
      speechSynthesis.onvoiceschanged = ()=>{
        voicesLoaded = true;
        resolve(speechSynthesis.getVoices());
      };
    }
  });
}

async function speakMessage(message){
  if(!voicesLoaded) await loadVoices();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-US";
  speech.rate = 0.95;
  speech.pitch = 1.3;

  const voices = speechSynthesis.getVoices();

  const femaleVoice = voices.find(v =>
    v.name.toLowerCase().includes("zira") ||
    v.name.toLowerCase().includes("female") ||
    v.name.toLowerCase().includes("google") ||
    v.name.toLowerCase().includes("samantha")
  );

  if(femaleVoice) speech.voice = femaleVoice;

  speechSynthesis.cancel();
speechSynthesis.speak(speech);
}

// ====== CHART DATA STORAGE ======
let historyLabels = [];
let historyData = {
  A: [],
  B: [],
  C: [],
  D: []
};
let levelChart = null;

function initNotifications(){

  if(!("Notification" in window)){
    console.log("Notifications not supported");
    return;
  }

  if(Notification.permission !== "granted"){
    Notification.requestPermission().then(permission=>{
      console.log("Notification permission:",permission);
    });
  }

}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),4000);
}

function notify(title,msg){

  showToast(msg);

  if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
  }

  if("Notification" in window && Notification.permission==="granted"){
    new Notification(title,{body:msg});
  }

}

async function sendUpdate(binId,extra){
  const payload=Object.assign({binId,weight:0,level:100,fullBy:"none"},extra||{});
  fetch("/api/update-bin",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
}

function markFullWeight(i){sendUpdate(i,{weight:8,level:15,fullBy:"weight"});}
function markFullLevel(i){sendUpdate(i,{weight:1,level:5,fullBy:"level"});}
function markClean(i){sendUpdate(i,{weight:0.2,level:100,fullBy:"none"});}

// ===== INIT CHART =====
function initChart(){
  const ctx = document.getElementById('levelChart').getContext('2d');
  levelChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: historyLabels,
      datasets: [
        { label: 'Dustbin A', data: historyData.A, borderColor:'#00eaff', backgroundColor:'rgba(0,234,255,0.15)', tension:0.3 },
        { label: 'Dustbin B', data: historyData.B, borderColor:'#00ff7f', backgroundColor:'rgba(0,255,127,0.15)', tension:0.3 },
        { label: 'Dustbin C', data: historyData.C, borderColor:'#ffc400', backgroundColor:'rgba(255,196,0,0.15)', tension:0.3 },
        { label: 'Dustbin D', data: historyData.D, borderColor:'#ff4dd2', backgroundColor:'rgba(255,77,210,0.15)', tension:0.3 }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: { color:'#ffffff' }
        },
        title: {
          display:false
        }
      },
      scales: {
        x: { ticks:{ color:'#bbbbbb' }, grid:{ color:'rgba(255,255,255,0.08)' } },
        y: {
          min:0,max:100,
          ticks:{ color:'#bbbbbb', callback:v=>v+'%' },
          grid:{ color:'rgba(255,255,255,0.08)' }
        }
      }
    }
  });
}

// update history arrays then refresh chart
function updateChartFromBins(bins){
  // map id -> level
  const levelsById = {A:0,B:0,C:0,D:0};
  bins.forEach(b=>{
    if (levelsById.hasOwnProperty(b.id)) {
      levelsById[b.id] = b.level;
    }
  });

  const label = new Date().toLocaleTimeString();
  historyLabels.push(label);
  if(historyLabels.length>20) historyLabels.shift();

  ['A','B','C','D'].forEach(id=>{
    historyData[id].push(levelsById[id]);
    if(historyData[id].length>20) historyData[id].shift();
  });

  if(levelChart) levelChart.update();
}

async function loadBins(){
  try{
    const res = await fetch("/api/bins");
    const bins = await res.json();
    const body=document.getElementById("binsBody");
    body.innerHTML="";

    let total=bins.length;
    let fullCount=0, nearCount=0, okCount=0;

    bins.forEach(bin=>{
      const isFull=(bin.fullBy && bin.fullBy!=="none");
      const levelPercent = bin.level.toFixed(0);

      if(isFull) fullCount++;
      else if(bin.level<=30) nearCount++;
      else okCount++;

      const tr=document.createElement("tr");
      tr.className=isFull?"status-full":bin.level<=30?"status-mid":"status-ok";

      // format updatedAt into local readable time
      let niceTime = "-";
      if (bin.updatedAt) {
        niceTime = new Date(bin.updatedAt).toLocaleString('en-IN', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }

      tr.innerHTML = `
        <td>${bin.name}</td>
        <td>${bin.weight.toFixed(2)}</td>
        <td>
          <div class="level-cell">
            <div class="level-bar-bg">
              <div class="level-bar-fill" style="width:${levelPercent}%;"></div>
            </div>
            <span class="level-text">${levelPercent}%</span>
          </div>
        </td>
        <td>${bin.fullBy}</td>
        <td>${isFull ? "FULL ("+bin.fullBy+")" : "OK"}</td>
        <td>${niceTime}</td>
      `;
      body.appendChild(tr);

      const prev=previousState[bin.id]||{full:false};

if(isFull && !prev.full){
  notify("Smart Dustbin Alert",`Dustbin ${bin.id} is FULL (${bin.fullBy})`);
  speakMessage(`Alert. Dustbin ${bin.id} is full. Please empty it.`);
}

if(!isFull && prev.full){
  notify("Smart Dustbin Update",`Dustbin ${bin.id} has been CLEANED`);
  speakMessage(`Dustbin ${bin.id} has been cleaned. Thank you.`);
}

previousState[bin.id]={full:isFull};
    });

    // update stat cards
    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-full").textContent  = fullCount;
    document.getElementById("stat-near").textContent  = nearCount;
    document.getElementById("stat-ok").textContent    = okCount;

    document.getElementById("lastUpdated").innerText =
      "Last updated: "+new Date().toLocaleTimeString();

    // chart data update
    if (!levelChart) initChart();
    updateChartFromBins(bins);

  }catch(e){
    console.error(e);
  }
}

initNotifications();
loadBins();
setInterval(loadBins,3000);
</script>
</body>
</html>
